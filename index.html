<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const V3 = THREE.Vector3;
const DEG = Math.PI / 180;
const MAX_MODULES = 140000;  // teto de tamanho da palavra
const MAX_NODES = 30000;     // teto de nós do esqueleto
const MAX_INST = 45000;      // teto de instâncias por tipo
const MIN_R = 0.004;

/* =====================================================================
   1. PRNG determinística: cyrb128 (hash da string) -> sfc32
   ===================================================================== */
function cyrb128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  h1 ^= (h2 ^ h3 ^ h4); h2 ^= h1; h3 ^= h1; h4 ^= h1;
  return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
}
function sfc32(a, b, c, d) {
  return function () {
    a |= 0; b |= 0; c |= 0; d |= 0;
    const t = (a + b | 0) + d | 0;
    d = d + 1 | 0; a = b ^ b >>> 9; b = c + (c << 3) | 0;
    c = (c << 21 | c >>> 11); c = c + t | 0;
    return (t >>> 0) / 4294967296;
  };
}
class Rand {
  constructor(str) { this.next = sfc32(...cyrb128(str)); for (let i = 0; i < 15; i++) this.next(); }
  f() { return this.next(); }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  chance(p) { return this.next() < p; }
  jit(x) { return (this.next() * 2 - 1) * x; }
}
const hex = (str) => cyrb128(str).map(x => x.toString(16).padStart(8, '0')).join('');
const n = (x) => +(+x).toFixed(3);

/* =====================================================================
   2. Motor L-System genérico (paramétrico + estocástico + tempo de nascimento)
   Módulo = { c: símbolo, p: [parâmetros] | null, t0, t1: nascimento, die: morte }
   Regra  = string | (params, rng) => string | [{w, s}] (estocástica)
   Tempo de desenvolvimento: a iteração i ocupa a janela [i, i+1]; os F de um
   sucessor crescem em sequência dentro dessa janela. Regras identidade (F→F')
   herdam o tempo (o mesmo entrenó, só alongado).
   ===================================================================== */
const TOKEN = /([^\s(),])(?:\(([^)]*)\))?/g;
function parseWord(str) {
  const out = [];
  TOKEN.lastIndex = 0; let m;
  while ((m = TOKEN.exec(str))) out.push({ c: m[1], p: m[2] !== undefined ? m[2].split(',').map(Number) : null });
  return out;
}
function applyRule(rule, m, rng) {
  if (typeof rule === 'function') return rule(m.p || [], rng);
  if (Array.isArray(rule)) { // estocástica com pesos
    const tot = rule.reduce((a, r) => a + r.w, 0); let x = rng.f() * tot;
    for (const r of rule) { if ((x -= r.w) <= 0) return typeof r.s === 'function' ? r.s(m.p || [], rng) : r.s; }
    return rule[rule.length - 1].s;
  }
  return rule;
}
function stamp(mods, i) {
  let nF = 0; for (const m of mods) if (m.c === 'F') nF++;
  const d = Math.max(nF, 1); let k = 0;
  for (const m of mods) { if (m.c === 'F') { m.t0 = i + k / d; k++; m.t1 = i + k / d; } else { m.t0 = m.t1 = i + k / d; } }
}
function rewrite(word, rules, rng, i, juvenile, jrng, def_jlife) {
  const out = [];
  for (const m of word) {
    const rule = rules[m.c];
    if (rule === undefined) { out.push(m); continue; }
    const succ = applyRule(rule, m, rng);
    if (succ == null) { out.push(m); continue; }
    const S = parseWord(succ);
    if (S.length === 1 && S[0].c === m.c) { S[0].t0 = m.t0; S[0].t1 = m.t1; S[0].die = m.die; out.push(S[0]); continue; }
    if (juvenile && juvenile[m.c]) { // folhas juvenis do ápice: vivem até o novo crescimento assumir
      const J = parseWord(applyRule(juvenile[m.c], m, jrng) || '');
      out.push({ c: '[', p: null, t0: m.t1, t1: m.t1 });
      for (const x of J) { if (x.c === 'F' || x.c === 'f') continue; x.t0 = x.t1 = m.t1; x.die = i + (def_jlife ?? 1.15); out.push(x); }
      out.push({ c: ']', p: null, t0: m.t1, t1: m.t1 });
    }
    stamp(S, i);
    for (let k = 0; k < S.length; k++) out.push(S[k]);
  }
  return out;
}
function runLSystem(def, iterations, rng, jrng) {
  let word = parseWord(def.axiom), done = 0;
  stamp(word, 0);
  for (; done < iterations; done++) {
    const next = rewrite(word, def.rules, rng, done + 1, def.juvenile, jrng, def.juvenileLife);
    if (next.length > MAX_MODULES) break;
    word = next;
  }
  if (def.finalize) word = rewrite(word, def.finalize, rng, done + 1, null, null); // pontas -> folhas/flores
  return { word, done, tEnd: done + 3.0 };
}
const wordToString = (w, max = 600) => {
  let s = ''; for (const m of w) { s += m.c + (m.p ? '(' + m.p.map(v => +v.toFixed(2)).join(',') + ')' : ''); if (s.length > max) return s.slice(0, max) + ' …'; }
  return s;
};

/* =====================================================================
   3. Tartaruga 3D (H = heading, L = left, U = up) -> esqueleto de nós
   F f + - & ^ \ / | [ ] ~  +  L (folha)  K (flor)  O (orbe)  N (tufo de agulhas)
   Cada F cria um nó {posição, pai, t0, t1}. Os raios saem depois do esqueleto.
   ===================================================================== */
const GRAV = new V3(0, -1, 0);
function interpret(word, sp, P, rng) {
  const X = [0], Y = [0], Z = [0], PAR = [-1], T0 = [0], T1 = [0];
  const inst = {};
  const add = (k, it) => { const a = inst[k] || (inst[k] = []); if (a.length < MAX_INST) a.push(it); };
  let st = { pos: new V3(), H: new V3(0, 1, 0), L: new V3(-1, 0, 0), U: new V3(0, 0, 1), trop: 0, node: 0 };
  const stack = [];
  const ax = new V3();
  const clone = (s) => ({ pos: s.pos.clone(), H: s.H.clone(), L: s.L.clone(), U: s.U.clone(), trop: s.trop, node: s.node });
  const defA = (P.angle || 25) * DEG;
  const roll = (sp.leafRoll ?? 35) * DEG;
  const life = (m) => [Math.max(m.t1 ?? 0, T1[st.node]), m.die ?? 1e9];
  for (const m of word) {
    const p = m.p, a = p ? p[0] * DEG : defA;
    switch (m.c) {
      case 'F': case 'f': {
        const len = p ? p[0] : 1;
        st.pos.addScaledVector(st.H, len);
        if (m.c === 'F' && len > 1e-5 && X.length < MAX_NODES) {
          const par = st.node; let t0 = m.t0 ?? 0, t1 = m.t1 ?? t0;
          if (t0 < T1[par]) { const dd = Math.max(t1 - t0, 0.02); t0 = T1[par]; t1 = t0 + dd; }
          X.push(st.pos.x); Y.push(st.pos.y); Z.push(st.pos.z); PAR.push(par); T0.push(t0); T1.push(t1);
          st.node = X.length - 1;
        }
        if (st.trop !== 0) { // tropismo (gravidade / fototropismo)
          ax.crossVectors(st.H, GRAV); const mag = ax.length();
          if (mag > 1e-6) { ax.multiplyScalar(1 / mag); const ang = st.trop * mag; st.H.applyAxisAngle(ax, ang); st.L.applyAxisAngle(ax, ang); st.U.applyAxisAngle(ax, ang); }
        }
        st.H.normalize(); st.L.crossVectors(st.U, st.H).normalize(); st.U.crossVectors(st.H, st.L);
        break;
      }
      case '+': st.H.applyAxisAngle(st.U, a); st.L.applyAxisAngle(st.U, a); break;
      case '-': st.H.applyAxisAngle(st.U, -a); st.L.applyAxisAngle(st.U, -a); break;
      case '&': st.H.applyAxisAngle(st.L, a); st.U.applyAxisAngle(st.L, a); break;
      case '^': st.H.applyAxisAngle(st.L, -a); st.U.applyAxisAngle(st.L, -a); break;
      case '\\': st.L.applyAxisAngle(st.H, a); st.U.applyAxisAngle(st.H, a); break;
      case '/': st.L.applyAxisAngle(st.H, -a); st.U.applyAxisAngle(st.H, -a); break;
      case '|': st.H.applyAxisAngle(st.U, Math.PI); st.L.applyAxisAngle(st.U, Math.PI); break;
      case '~': st.trop = p ? p[0] : 0; break;
      case '[': stack.push(clone(st)); break;
      case ']': if (stack.length) st = stack.pop(); break;
      case 'L': {
        const z = st.U.clone().applyAxisAngle(st.H, rng.jit(roll));
        add('leaf', { p: st.pos.clone(), y: st.H.clone(), z, s: p ? p[0] : 1, life: life(m) });
        break;
      }
      case 'K': {
        const s = p ? p[0] : 1, np = P.petals || 5, open = (P.open || 60) * DEG, off = rng.f() * Math.PI * 2;
        const layers = P.double ? 2 : 1, lf = life(m);
        for (let l = 0; l < layers; l++) {
          for (let i = 0; i < np; i++) {
            const ang = off + (i + l * 0.5) / np * Math.PI * 2 + rng.jit(0.12);
            const r = st.L.clone().multiplyScalar(Math.cos(ang)).addScaledVector(st.U, Math.sin(ang));
            const t = st.L.clone().multiplyScalar(-Math.sin(ang)).addScaledVector(st.U, Math.cos(ang));
            const o = open * (l ? 0.55 : 1) + rng.jit(0.1);
            const dir = st.H.clone().multiplyScalar(Math.cos(o)).addScaledVector(r, Math.sin(o)).normalize();
            const nrm = new V3().crossVectors(dir, t).normalize();
            add('petal', { p: st.pos.clone(), y: dir, z: nrm, s: s * (l ? 0.72 : 1), life: lf, layer: l });
          }
        }
        add('center', { p: st.pos.clone().addScaledVector(st.H, s * 0.06), y: st.H.clone(), z: st.U.clone(), s: s * 0.17, life: lf });
        break;
      }
      case 'O': add('orb', { p: st.pos.clone(), y: st.H.clone(), z: st.U.clone(), s: p ? p[0] : 0.1, life: life(m) }); break;
      case 'N': add('needles', { p: st.pos.clone(), y: st.H.clone(), z: st.U.clone().applyAxisAngle(st.H, rng.f() * 6.28), s: p ? p[0] : 0.3, life: life(m) }); break;
    }
  }
  const N = X.length;
  return { sk: { N, X: Float32Array.from(X), Y: Float32Array.from(Y), Z: Float32Array.from(Z), PAR: Int32Array.from(PAR), T0: Float32Array.from(T0), T1: Float32Array.from(T1) }, inst };
}
/* =====================================================================
   4. Geometrias base (folha, pétala, agulhas, esfera)
   ===================================================================== */
function sheet({ width = 0.4, fold = 0.1, curve = 0.1, profile, nu = 8, nv = 2, cup = 0 }) {
  const pos = [], idx = [];
  for (let i = 0; i <= nu; i++) {
    const u = i / nu, w = width * profile(u);
    for (let j = -nv; j <= nv; j++) {
      const v = j / nv;
      pos.push(v * w, u, fold * Math.abs(v) * w + curve * u * u + cup * v * v * w);
    }
  }
  const row = nv * 2 + 1;
  for (let i = 0; i < nu; i++) for (let j = 0; j < row - 1; j++) {
    const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
    idx.push(a, b, d, a, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const PROFILES = {
  oval: (u) => Math.pow(Math.sin(Math.PI * Math.min(1, u * 0.98 + 0.02)), 0.75),
  lance: (u) => Math.pow(Math.sin(Math.PI * u), 0.9) * (1 - 0.35 * u),
  petal: (u) => { const x = (u - 0.58) / 0.58; return Math.sqrt(Math.max(0, 1 - x * x)) + 0.05; },
};
function needleTuft(count = 18) {
  const pos = [];
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count, a = i * 2.39996;
    const base = new V3(0, t, 0), dir = new V3(Math.cos(a), 0.55, Math.sin(a)).normalize();
    const tip = base.clone().addScaledVector(dir, 1);
    const side = new V3(-Math.sin(a), 0, Math.cos(a)).multiplyScalar(0.035);
    const up = new V3(0, 0.035, 0);
    for (const sv of [side, up]) {
      pos.push(base.x + sv.x, base.y + sv.y, base.z + sv.z, base.x - sv.x, base.y - sv.y, base.z - sv.z, tip.x, tip.y, tip.z);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  return g;
}
const GEOMS = {
  oak: () => sheet({ width: 0.42, fold: 0.18, curve: 0.12, profile: PROFILES.oval }),
  bush: () => sheet({ width: 0.36, fold: 0.15, curve: 0.08, profile: PROFILES.oval }),
  fern: () => sheet({ width: 0.3, fold: 0.06, curve: 0.08, profile: PROFILES.lance, nu: 5, nv: 1 }),
  willow: () => sheet({ width: 0.14, fold: 0.05, curve: 0.18, profile: PROFILES.lance, nu: 5, nv: 1 }),
  petal: () => sheet({ width: 0.34, fold: 0.0, curve: -0.12, cup: 0.25, profile: PROFILES.petal, nu: 7, nv: 3 }),
  needles: () => needleTuft(26),
  sphere: () => new THREE.IcosahedronGeometry(1, 1),
};

/* =====================================================================
   5. Shaders: idade (crescimento + engrossamento) + vento
   Galhos: cada anel de vértices lê o raio atual dos nós numa textura float
   (recalculada na CPU pela regra de Leonardo para a idade corrente).
   ===================================================================== */
const SHARED = { uGrowth: { value: 1 }, uTime: { value: 0 }, uWind: { value: 1 } };
const SWAY = /* glsl */`
uniform float uGrowth; uniform float uTime; uniform float uWind; uniform float uH; uniform float uTend;
vec3 lsSway(vec3 p){

  return vec3(sin(uTime*1.3 + p.x*0.35 + p.z*0.2)*k + sin(uTime*2.9 + p.y*0.9)*k*0.25, 0.0, cos(uTime*1.07 + p.z*0.33)*k*0.7);

  const gr = g.createLinearGradient(0, 0, 0, 512); stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const THEMES = {
  day: { bg: gradientTex([[0, '#7fb2e5'], [0.55, '#cfe4ef'], [1, '#e9e3d0']]), fog: 0xdfe3d6, ground: 0x6a8a4c, soil: 0x4a3a2a, hemi: [0xdfefff, 0x4a3a28, 1.1], sun: [0xfff1d6, 2.7], fill: 0.5, exp: 1.0, bloom: [0.35, 0.4, 0.95] },
  night: { bg: gradientTex([[0, '#03040d'], [0.6, '#0c1030'], [1, '#1d1838']]), fog: 0x141433, ground: 0x10182a, soil: 0x0a0d18, hemi: [0x7080d0, 0x202040, 0.8], sun: [0x9fb4ff, 1.0], fill: 0.3, exp: 1.1, bloom: [0.6, 0.45, 0.85] },
};
const composerRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerRT);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.4, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function setTheme(name) {
  const t = THEMES[name];
  scene.background = t.bg; scene.fog = new THREE.Fog(t.fog, 30, 160);
  ground.material.color.set(t.ground); soil.material.color.set(t.soil);
  hemi.color.set(t.hemi[0]); hemi.groundColor.set(t.hemi[1]); hemi.intensity = t.hemi[2];
  sun.color.set(t.sun[0]); sun.intensity = t.sun[1]; fill.intensity = t.fill;
  renderer.toneMappingExposure = t.exp;
  [bloom.strength, bloom.radius, bloom.threshold] = t.bloom;
}

function panelOffset() {
  const hidden = $('panel').classList.contains('hidden');
  if (hidden) return { x: 0, y: 0 };
  if (innerWidth > 700) return { x: 368, y: 0 };
  return { x: 0, y: Math.min($('panel').offsetHeight, innerHeight * 0.55) + 14 };
}
function applyViewOffset() {
  const off = panelOffset();
  camera.aspect = innerWidth / innerHeight;
  if (off.x || off.y) camera.setViewOffset(innerWidth, innerHeight, -off.x / 2, off.y / 2, innerWidth, innerHeight); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
function frame(box, { dir = new V3(0.75, 0.32, 1), pad = 1.12 } = {}) {
  applyViewOffset();
  const size = box.getSize(new V3()), center = box.getCenter(new V3());
  const off = panelOffset(), visH = (innerHeight - off.y) / innerHeight;
  const fov = camera.fov * DEG, aspect = (innerWidth - off.x) / innerHeight;
  const halfH = size.y / 2 / visH, halfW = Math.max(size.x, size.z) / 2;
  const dist = Math.max(halfH / Math.tan(fov / 2), halfW / (Math.tan(fov / 2) * aspect)) * pad + size.z * 0.5;
  const target = center.clone(); target.y = size.y * 0.46;
  camera.position.copy(target).addScaledVector(dir.clone().normalize(), dist);
  controls.target.copy(target); controls.update();
  follow = { dist, ty: target.y, h: size.y, z: 1 };
  // sombra cobre a planta
  const rad = Math.max(size.x, size.y, size.z) * 0.85 + 2;
  sun.position.copy(center).add(new V3(rad * 0.8, rad * 1.6, rad * 0.6)); sun.target.position.copy(center);
  const sc = sun.shadow.camera; sc.left = -rad; sc.right = rad; sc.top = rad; sc.bottom = -rad; sc.near = 0.5; sc.far = rad * 5; sc.updateProjectionMatrix();
  scene.fog.near = dist * 1.3; scene.fog.far = dist * 5;
}

/* =====================================================================
   9. UI / estado
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const ui = { species: $('species'), seed: $('seed'), growth: $('growth') };
for (const id of ORDER) { const o = document.createElement('option'); o.value = id; o.textContent = `${SPECIES[id].emoji}  ${SPECIES[id].name}`; ui.species.appendChild(o); }
let plants = [], mode = 'single', anim = null, labels = [];
let follow = null;

const WORDS = ['orvalho', 'musgo', 'aurora', 'raiz', 'brisa', 'semente', 'samba', 'ipê', 'jabuti', 'lua', 'cipó', 'trovão', 'sereno', 'pólen', 'arara', 'neblina', 'carvalho', 'vento', 'jardim', 'galáxia'];
const randomSeed = () => `${WORDS[Math.floor(Math.random() * WORDS.length)]}-${WORDS[Math.floor(Math.random() * WORDS.length)]}-${Math.floor(Math.random() * 1000)}`;

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  return { esp: h.get('especie'), seed: h.get('seed') };
}
function writeHash() {
  const esp = mode === 'garden' ? 'jardim' : ui.species.value;
  const s = `#especie=${encodeURIComponent(esp)}&seed=${encodeURIComponent(ui.seed.value)}`;
  if (location.hash !== s) history.replaceState(null, '', s);
}

function fmtVal(v, unit) { if (typeof v === 'boolean') return v ? 'sim' : 'não'; if (typeof v === 'number') return (Number.isInteger(v) ? v : v.toFixed(unit === '°' ? 1 : 3)) + (unit || ''); return v; }
function showInfo(pl) {
  const { sp, P, def, W } = pl;
  const wood = [['Expoente de Leonardo (e)', W.leo.toFixed(2)], ['Crescimento secundário (G)', W.G.toFixed(2)], ['Irregularidade da casca', (sp.bump ?? 0).toFixed(2)]];
  $('params').innerHTML = sp.show.map(([k, label, unit]) => `<tr><td>${label}</td><td>${fmtVal(k === 'iterations' ? pl.done : P[k], unit)}</td></tr>`).join('')
    + wood.map(([l, v]) => `<tr><td>${l}</td><td>${v}</td></tr>`).join('');
  $('rules').textContent = def.display.join('\n') + `\n\nraio (Leonardo): r(nó)^${W.leo.toFixed(2)} = Σ r(filho)^${W.leo.toFixed(2)}, pontas = r₀\n` +
    `idade: só existem nós nascidos até t; r ×= 1 + ${W.G.toFixed(2)}·(t − nascimento)/t_max`;
  $('word').textContent = wordToString(pl.word, 700);
  $('dna').innerHTML = `DNA <b>${hex(ui.seed.value + '::' + pl.id).slice(0, 32)}</b>`;
}
function showStats() {
  const s = plants.reduce((a, p) => ({ modules: a.modules + p.stats.modules, nodes: a.nodes + p.stats.nodes, verts: a.verts + p.stats.verts, inst: a.inst + p.stats.inst, ms: a.ms + p.stats.ms }), { modules: 0, nodes: 0, verts: 0, inst: 0, ms: 0 });
  const f = (x) => x.toLocaleString('pt-BR');
  const detail = plants.length === 1 ? ' · ' + Object.entries(plants[0].stats.counts).map(([k, v]) => `${k}: ${v}`).join(' · ') + ` · ${plants[0].stats.chains} galhos` : '';
  $('stats').textContent = `${f(s.modules)} módulos · ${f(s.nodes)} nós · ${f(s.verts)} vértices de tubo · ${f(s.inst)} instâncias${detail} · ${s.ms.toFixed(0)} ms`;
}
function clearPlants() { plants.forEach(disposePlant); plants = []; labels.forEach(l => l.el.remove()); labels = []; }

async function generate({ animate = true } = {}) {
  $('busy').style.display = 'block';
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  try {
    clearPlants();
    const seed = ui.seed.value.trim() || 'lindenmayer'; ui.seed.value = seed;
    if (mode === 'single') {
      const id = ui.species.value; const pl = buildPlant(id, seed);
      plants.push(pl); scene.add(pl.object);
      setTheme(pl.sp.theme);
      const size = pl.box.getSize(new V3());
      soil.scale.setScalar(Math.max(size.x, size.z) * 0.32 + 0.5);
      glowLight.intensity = id === 'salgueiro' ? 30 : 0;
      if (id === 'salgueiro') { glowLight.color = hsl(pl.P.glowH, 0.9, 0.6); glowLight.position.set(0, size.y * 0.35, 0); glowLight.distance = size.y * 3; }
      frame(pl.box);
      $('capT').textContent = `${pl.sp.emoji} ${pl.sp.name}`; $('capD').textContent = pl.sp.desc;
      showInfo(pl);
    } else {
      setTheme('day'); glowLight.intensity = 0;
      const gap = 2.2; let x = 0; const built = ORDER.map(id => buildPlant(id, seed));
      const widths = built.map(p => { const s = p.box.getSize(new V3()); return Math.max(s.x, s.z) * 0.72; });
      const totalW = widths.reduce((a, b) => a + b, 0) + gap * (built.length - 1);
      x = -totalW / 2;
      const all = new THREE.Box3();
      built.forEach((pl, i) => {
        const cx = x + widths[i] / 2; x += widths[i] + gap;
        const z = -Math.abs(cx) * 0.18;
        pl.object.position.set(cx, 0, z); scene.add(pl.object); plants.push(pl);
        const b = pl.box.clone().translate(new V3(cx, 0, z)); all.union(b);
        const el = document.createElement('div'); el.className = 'glabel'; el.textContent = `${pl.sp.emoji} ${pl.sp.name}`;
        el.onclick = () => { ui.species.value = pl.id; setMode('single'); generate(); };
        $('labels').appendChild(el); labels.push({ el, pos: new V3(cx, -0.2, z + 0.5) });
      });
      soil.scale.setScalar(0.001);
      frame(all, { dir: new V3(0.12, 0.22, 1), pad: 1.04 });
      $('capT').textContent = '🌿 Jardim: as 5 espécies'; $('capD').textContent = `Mesma seed "${seed}", cinco gramáticas diferentes. Clique no nome para abrir a espécie.`;
      showInfo(built[ORDER.indexOf(ui.species.value)] || built[0]);
    }
    showStats(); writeHash();
    if (animate) startGrowth(); else { SHARED.uGrowth.value = 1; syncSlider(); }
  } catch (e) { showErr(e); }
  $('busy').style.display = 'none';
}

function startGrowth() { anim = { t0: performance.now(), dur: 7000 }; SHARED.uGrowth.value = 0; }
function syncSlider() { ui.growth.value = SHARED.uGrowth.value; $('gval').textContent = Math.round(SHARED.uGrowth.value * 100) + '%'; }
function setMode(m) { mode = m; $('garden').classList.toggle('on', m === 'garden'); $('garden').textContent = m === 'garden' ? '🌱 Ver uma espécie' : '🌿 Ver todas as 5'; }
function showErr(e) { console.error(e); const el = $('err'); el.style.display = 'block'; el.textContent = String(e && e.stack || e); }

$('gen').onclick = () => generate();
$('rand').onclick = () => { ui.seed.value = randomSeed(); generate(); };
ui.seed.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
ui.species.onchange = () => { if (mode === 'garden') { showInfo(plants[ORDER.indexOf(ui.species.value)]); writeHash(); } else generate(); };
$('garden').onclick = () => { setMode(mode === 'garden' ? 'single' : 'garden'); generate(); };
$('replay').onclick = () => startGrowth();
ui.growth.oninput = () => { anim = null; SHARED.uGrowth.value = +ui.growth.value; syncSlider(); };
$('rotate').onchange = (e) => controls.autoRotate = e.target.checked;
$('wind').onchange = (e) => SHARED.uWind.value = e.target.checked ? 1 : 0;
$('share').onclick = async () => { writeHash(); try { await navigator.clipboard.writeText(location.href); $('share').textContent = '✔ Link copiado'; } catch { prompt('Copie o link:', location.href); } setTimeout(() => $('share').textContent = '🔗 Copiar link', 1500); };
$('hide').onclick = () => { $('panel').classList.add('hidden'); applyViewOffset(); };
$('toggle').onclick = () => { $('panel').classList.remove('hidden'); applyViewOffset(); };
addEventListener('hashchange', () => { const h = readHash(); if (h.seed && (h.seed !== ui.seed.value || (h.esp === 'jardim') !== (mode === 'garden') || (h.esp !== 'jardim' && h.esp !== ui.species.value))) init(); });
addEventListener('resize', () => {
  applyViewOffset();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

function init() {
  const h = readHash();
  ui.seed.value = h.seed || 'lindenmayer';
  if (h.esp === 'jardim') setMode('garden'); else { setMode('single'); if (SPECIES[h.esp]) ui.species.value = h.esp; }
  const q = new URLSearchParams(location.search);
  if (q.has('age')) { generate({ animate: false }).then(() => { SHARED.uGrowth.value = THREE.MathUtils.clamp(+q.get('age'), 0, 1); syncSlider(); }); }
  else if (q.has('nogrow')) { generate({ animate: false }); } else generate();
  if (q.has('norotate')) { controls.autoRotate = false; $('rotate').checked = false; }
}

const clock = new THREE.Clock();
const tmpV = new V3();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  SHARED.uTime.value += dt;
  if (anim) {
    const k = Math.min((performance.now() - anim.t0) / anim.dur, 1);
    SHARED.uGrowth.value = 1 - Math.pow(1 - k, 1.6);
    syncSlider(); if (k >= 1) anim = null;
  }
  const ageChanged = plants.some(pl => pl.lastAge !== SHARED.uGrowth.value);
  for (const pl of plants) pl.update(SHARED.uGrowth.value);
  if (follow && mode === 'single' && plants[0] && $('follow').checked && (ageChanged || anim)) {
    // câmera acompanha a idade: aproxima na muda, afasta conforme cresce
    const want = THREE.MathUtils.clamp((plants[0].curH || 0) / follow.h * 1.15, 0.22, 1);
    follow.z += (want - follow.z) * (anim ? 0.08 : 1);
    const d = camera.position.clone().sub(controls.target).normalize();
    controls.target.y = follow.ty * follow.z; camera.position.copy(controls.target).addScaledVector(d, follow.dist * follow.z);
  }
  controls.update();
  composer.render();
  for (const l of labels) {
    tmpV.copy(l.pos).project(camera);
    l.el.style.left = ((tmpV.x * 0.5 + 0.5) * innerWidth) + 'px'; l.el.style.top = ((-tmpV.y * 0.5 + 0.5) * innerHeight + 8) + 'px';
    l.el.style.display = tmpV.z < 1 ? 'block' : 'none';
  }
}
window.camera = camera; window.controls = controls; window.THREE = THREE; window.__lsys = { buildPlant, SPECIES, SHARED, get plants() { return plants; }, generate, setMode };
addEventListener('error', (e) => showErr(e.error || e.message));
init(); loop();
</script>
