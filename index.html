<!doctype html>
<html lang="pt-BR">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonsai Garden · POC Three.js</title>
<style>

  #app{position:fixed;inset:0}
  #app canvas{display:block}
  #panel{position:fixed;top:14px;left:14px;width:340px;max-height:calc(100% - 28px);overflow:auto;background:var(--bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;padding:16px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:transform .3s}
  #panel.hidden{transform:translateX(calc(-100% - 20px))}
  #panel h1{font-size:18px;margin:0 0 2px;letter-spacing:.2px}
  #panel .sub{margin:0 0 12px;color:var(--mut);font-size:12px}
  label.l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:10px 0 5px}
  select,input[type=text]{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--bd);color:var(--fg);border-radius:10px;padding:9px 10px;font-size:14px;outline:none}
  select option{background:#16201c}
  input[type=text]:focus,select:focus{border-color:var(--acc)}
  .row{display:flex;gap:8px;margin-top:8px}
  .row>*{flex:1}
  button{cursor:pointer;background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:600;transition:.15s}
  button:hover{background:rgba(255,255,255,.16)}
  button.primary{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#062312;border:none}

  input[type=range]{width:100%;accent-color:var(--acc)}
  .note{margin:6px 0 0;font-size:12px;color:var(--mut);line-height:1.35}

  <label class="l" for="seed">Seed (DNA da planta)</label>
  <input id="seed" type="text" spellcheck="false" autocomplete="off">

    <button id="rand">🎲 Seed aleatória</button>
    <button id="gen" class="primary">Gerar</button>

    <button id="share">🔗 Copiar link</button>

  <div class="row"><button id="replay">▶ Animar crescimento (muda → bonsai)</button></div>
  <div class="toggles">
    <label><input type="checkbox" id="rotate" checked> Auto-rotação</label>
    <label><input type="checkbox" id="wind" checked> Vento</label>
    <label><input type="checkbox" id="follow" checked> Câmera segue</label>

    <input id="windStr" type="range" min="0" max="2" step="0.01" value="1">

    <label class="l">Sol — azimute / altura <span id="sunV"></span></label>

    <input id="gravStr" type="range" min="0" max="2" step="0.01" value="0">
    <input id="photoStr" type="range" min="0" max="1" step="0.01" value="0">
  </details>

  <details open><summary>Genoma — pais, filho, genes</summary>
    <p class="note" id="geneMode">Visual padrão da espécie (genes só de leitura). Cruze ou edite um gene para aplicar.</p>
    <div class="row"><input id="crossA" type="text" placeholder="Pai A (seed)" spellcheck="false"><input id="crossB" type="text" placeholder="Pai B (seed)" spellcheck="false"></div>
    <div class="row"><button id="crossBtn" class="primary">🧬 Cruzar → filho</button><button id="mutateBtn">Mutar filho</button></div>
    <p class="note" id="childLabel"></p>
    <div id="geneSliders"></div>
    <button id="resetGenes">Voltar ao visual da seed</button>
  </details>

  <div class="row"><button id="snap">📷 PNG</button><button id="gltf">📦 glTF</button></div>

  <div id="dna"></div>
  <details open><summary>Parâmetros derivados da seed</summary><table id="params"></table></details>
  <details><summary>Regras do L-System</summary><pre id="rules"></pre></details>
  <details><summary>Palavra gerada (início)</summary><pre id="word"></pre></details>
  <div id="stats"></div>
</aside>
<button id="toggle" title="Mostrar painel">☰</button>
<div id="caption"><h2 id="capT"></h2><p id="capD"></p></div>
<div id="busy">Gerando…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import {
  GENE_CATALOG, genomeFromSeed, parseGenomeHash, genomeToHash, mergeGenome, crossGenomes,
  applyGenomeToPlant, genomeTableRows, applyGravitySag, clusterFoliage, buildJointMeshes, deflectRoots, childSeed,
  ENV_DEFAULT, envSunDir, envWindDir, makeSunShade, phototropismBias, lightGradientAt,
} from './v8-engine.mjs';
import {
  Rand, SPECIES, BARK, SIMS, ALL, BONSAI, hex, n, computeRadii, wordToString,
  buildSkeletonPackage, deserializeInst, serializeInst, unpackWorkerPayload,
} from './lsystem-core.mjs';

const hsl = (h, s, l) => new THREE.Color().setHSL(((h % 360) + 360) % 360 / 360, THREE.MathUtils.clamp(s, 0, 1), THREE.MathUtils.clamp(l, 0, 1));

const V3 = THREE.Vector3;
const DEG = Math.PI / 180;
const MIN_R = 0.004;

/* =====================================================================
   4. Geometrias base (folha, pétala, agulhas, esfera)
   ===================================================================== */
function sheet({ width = 0.4, fold = 0.1, curve = 0.1, profile, nu = 8, nv = 2, cup = 0 }) {
  const pos = [], idx = [];
  for (let i = 0; i <= nu; i++) {
    const u = i / nu, w = width * profile(u);
    for (let j = -nv; j <= nv; j++) {
      const v = j / nv;
      pos.push(v * w, u, fold * Math.abs(v) * w + curve * u * u + cup * v * v * w);
    }
  }
  const row = nv * 2 + 1;
  for (let i = 0; i < nu; i++) for (let j = 0; j < row - 1; j++) {
    const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
    idx.push(a, b, d, a, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const PROFILES = {
  oval: (u) => Math.pow(Math.sin(Math.PI * Math.min(1, u * 0.98 + 0.02)), 0.75),
  lance: (u) => Math.pow(Math.sin(Math.PI * u), 0.9) * (1 - 0.35 * u),
  petal: (u) => { const x = (u - 0.58) / 0.58; return Math.sqrt(Math.max(0, 1 - x * x)) + 0.05; },
};
function needleTuft(count = 18) {
  const pos = [];
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count, a = i * 2.39996;
    const base = new V3(0, t, 0), dir = new V3(Math.cos(a), 0.55, Math.sin(a)).normalize();
    const tip = base.clone().addScaledVector(dir, 1);
    const side = new V3(-Math.sin(a), 0, Math.cos(a)).multiplyScalar(0.035);
    const up = new V3(0, 0.035, 0);
    for (const sv of [side, up]) {
      pos.push(base.x + sv.x, base.y + sv.y, base.z + sv.z, base.x - sv.x, base.y - sv.y, base.z - sv.z, tip.x, tip.y, tip.z);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  return g;
}
const GEOMS = {
  petal: () => sheet({ width: 0.34, fold: 0.0, curve: -0.12, cup: 0.25, profile: PROFILES.petal, nu: 7, nv: 3 }),
  needles: () => needleTuft(26),
  sphere: () => new THREE.IcosahedronGeometry(1, 1),
  fruit: () => fruitGeo(),
  palm: () => palmGeo(5),
  palm7: () => palmGeo(7),
  hinoki: () => sheet({ width: 0.42, fold: 0.03, curve: 0.04, profile: (u) => (0.45 + 0.55 * Math.abs(Math.sin(u * Math.PI * 4.5))) * Math.pow(Math.sin(Math.PI * Math.min(1, u * 0.97 + 0.03)), 0.55), nu: 18, nv: 1 }),
};
// folha palmada do bordo: leque de lobos pontudos em volta do pecíolo, levemente côncava (origem = pecíolo, eixo +y)
function palmGeo(lobes) {
  const pos = [0, 0.32, 0], idx = [], R = 0.62, M = lobes * 8, span = 2.75;
  for (let i = 0; i <= M; i++) {
    const t = i / M, ph = -span / 2 + span * t;
    const lob = Math.pow(0.5 + 0.5 * Math.cos(t * lobes * 2 * Math.PI - Math.PI), 2.2);
    const r = R * (0.28 + 0.72 * lob) * (1 - 0.25 * Math.abs(ph) / span);
    pos.push(Math.sin(ph) * r, 0.32 + Math.cos(ph) * r, 0.1 * (r / R) * (r / R));
    if (i > 0) idx.push(0, i, i + 1);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
/* v6: vaso de bonsai procedural. Seção = superelipse (n = 2 oval/redondo, n alto = retangular com cantos arredondados),
   perfil = lábio da borda, parede (reta, inclinada ou bojuda), pé. Topo da terra em y = 0. */
function superE(a, b, n, th) { const c = Math.cos(th), s = Math.sin(th); return [a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)]; }
function potGeo({ a, b, h, n = 2, lip = 0.06, bulge = 0, taper = 0.12, foot = 0.08 }, M = 72) {
  const prof = [[0.94, -0.06 * h], [0.94, 0.02 * h], [1 + lip, 0.02 * h], [1 + lip, -0.07 * h], [1, -0.1 * h]];
  for (let k = 1; k <= 6; k++) { const f = k / 6; prof.push([1 - taper * f + bulge * Math.sin(Math.PI * f), -0.1 * h - f * (0.9 - foot) * h]); }
  const last = prof[prof.length - 1][0];
  prof.push([last * 0.97, -h + foot * h * 0.4], [last * 0.88, -h], [0, -h]);
  const pos = [], idx = [];
  for (const [r, y] of prof) for (let i = 0; i <= M; i++) { const [x, z] = superE(a * r, b * r, n, i / M * 6.2832); pos.push(x, y, z); }
  for (let j = 0; j < prof.length - 1; j++) for (let i = 0; i < M; i++) { const p0 = j * (M + 1) + i, p1 = p0 + 1, q0 = p0 + M + 1, q1 = q0 + 1; idx.push(p0, q0, p1, p1, q0, q1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
// terra com montinho e musgo (cor por vértice), dentro da borda do vaso
function soilGeo({ a, b, n = 2 }, mound, moss, rng, M = 64, Rn = 14) {
  const pos = [0, mound, 0], col = [], idx = [], ph = [rng.f() * 9, rng.f() * 9, rng.f() * 9];
  const cS = hsl(28, 0.35, 0.16), cM = hsl(95 + rng.jit(10), 0.38, 0.2), cM2 = hsl(85, 0.4, 0.25), tmp = new THREE.Color();
  // ruído de valor suave (fbm de 3 oitavas, eixos girados) — evita o padrão xadrez de sin·cos
  const hsh = (i, j) => { const h = Math.sin(i * 127.1 + j * 311.7 + ph[0] * 17.3) * 43758.5453; return h - Math.floor(h); };
  const vn = (x, z) => { const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j, ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
    const a0 = hsh(i, j), a1 = hsh(i + 1, j), b0 = hsh(i, j + 1), b1 = hsh(i + 1, j + 1); return a0 + (a1 - a0) * ux + (b0 - a0) * uz + (a0 - a1 - b0 + b1) * ux * uz; };
  const noise = (x, z) => { let v = 0, w = 0.55, f = 1.3, c = 0.8, sn = 0.6, X = x + ph[1], Z = z + ph[2];
    for (let o = 0; o < 3; o++) { v += w * vn(X * f, Z * f); const nx = X * c - Z * sn; Z = X * sn + Z * c; X = nx; w *= 0.5; f *= 2.1; } return v / 0.9625; };
  const colAt = (x, z) => { const v = noise(x / a * 2, z / b * 2); const m = THREE.MathUtils.smoothstep(v, 1 - moss - 0.05, 1 - moss + 0.1); tmp.copy(cS).lerp(v > 0.7 ? cM2 : cM, m); return [tmp.r, tmp.g, tmp.b, m]; };
  const c0 = colAt(0, 0); col.push(c0[0], c0[1], c0[2]);
  for (let k = 1; k <= Rn; k++) for (let i = 0; i < M; i++) {
    const r = 0.94 * k / Rn, [x, z] = superE(a * r, b * r, n, i / M * 6.2832), c = colAt(x, z);
    pos.push(x, mound * (1 - Math.pow(k / Rn, 2)) - 0.01 + c[3] * 0.015 * Math.min(a, b), z); col.push(c[0], c[1], c[2]);
  }
  for (let i = 0; i < M; i++) idx.push(0, 1 + ((i + 1) % M), 1 + i);
  for (let k = 1; k < Rn; k++) for (let i = 0; i < M; i++) { const p0 = 1 + (k - 1) * M + i, p1 = 1 + (k - 1) * M + (i + 1) % M, q0 = p0 + M, q1 = p1 + M; idx.push(p0, p1, q0, p1, q1, q0); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
// monta vaso + terra (+ mesa) num grupo; devolve pontos para o enquadramento e a cota do fundo
function makePot(group, o, rng) {
  const pot = new THREE.Mesh(potGeo(o), new THREE.MeshStandardMaterial({ color: asColor(o.color), roughness: o.rough ?? 0.75, metalness: 0, side: THREE.DoubleSide }));
  const soil = new THREE.Mesh(soilGeo(o, o.mound ?? 0.05 * Math.min(o.a, o.b), o.moss ?? 0.5, rng), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  for (const m of [pot, soil]) { m.castShadow = m.receiveShadow = true; group.add(m); }
  let floor = -o.h;
  if (o.stand) { // mesa baixa de madeira escura
    const wm = new THREE.MeshStandardMaterial({ color: asColor(o.stand, 0x2a1a10), roughness: 0.6 }), sh = o.h * 0.22, legH = o.h * 0.55;
    const top = new THREE.Mesh(new THREE.BoxGeometry(o.a * 2.6, sh, o.b * 2.7), wm); top.position.y = -o.h - sh / 2;
    const parts = [top];
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) { const l = new THREE.Mesh(new THREE.BoxGeometry(o.a * 0.18, legH, o.b * 0.2), wm); l.position.set(sx * o.a * 1.12, -o.h - sh - legH / 2, sz * o.b * 1.15); parts.push(l); }
    const rail = new THREE.Mesh(new THREE.BoxGeometry(o.a * 2.4, sh * 0.5, o.b * 0.12), wm); rail.position.set(0, -o.h - sh - legH * 0.75, o.b * 1.15); parts.push(rail);
    const rail2 = rail.clone(); rail2.position.z = -o.b * 1.15; parts.push(rail2);
    for (const m of parts) { m.castShadow = m.receiveShadow = true; group.add(m); }
    floor = -o.h - sh - legH;
  }
  const ex = o.stand ? 1.3 : 1.08;
  return { floor, points: [new V3(-o.a * ex, floor, -o.b * ex), new V3(o.a * ex, 0, o.b * ex)] };
}
function asColor(c, fallback = 0x888888) {
  if (!c) return new THREE.Color(fallback);
  if (c.isColor) return c;
  if (typeof c.r === 'number') return new THREE.Color(c.r, c.g, c.b);
  return new THREE.Color(c);
}
// fruto (símbolo Y): cabinho fino em cima (origem = ponto de inserção) e cápsula ovalada pendurada
function fruitGeo() {
  const pts = [new THREE.Vector2(0.012, 0), new THREE.Vector2(0.012, -0.55)];
  for (let i = 0; i <= 10; i++) { const t = i / 10, a = Math.PI * t; pts.push(new THREE.Vector2(Math.max(Math.sin(a) * 0.17, 0.003), -0.55 - 0.03 - (1 - Math.cos(a)) * 0.26)); }
  const g = new THREE.LatheGeometry(pts, 10); g.computeVertexNormals(); return g;
}
/* =====================================================================
   5. Shaders: idade (crescimento + engrossamento) + vento
   Galhos: cada anel de vértices lê o raio atual dos nós numa textura float
   (recalculada na CPU pela regra de Leonardo para a idade corrente).
   ===================================================================== */
const ENV = { ...ENV_DEFAULT };
let activeGenome = null, genomeOverlay = null, genomeApply = false;
const SHARED = {
  uGrowth: { value: 1 }, uTime: { value: 0 }, uWind: { value: 1 },
  uWindDir: { value: new THREE.Vector3(1, 0, 0) }, uWindStr: { value: 1 },
};
const SWAY = /* glsl */`
uniform float uGrowth; uniform float uTime; uniform float uWind; uniform float uH; uniform float uTend;
uniform vec3 uWindDir; uniform float uWindStr;
vec3 lsSway(vec3 p){
